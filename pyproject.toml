[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bsrt-semantic-compression"
version = "1.0.0"
description = "Budget-conditioned Transformer for question-independent semantic token compression"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Mehdi Mejrissi"}]
dependencies = [
  "numpy>=1.24",
  "safetensors>=0.4",
  "torch>=2.2",
  "transformers>=4.40,<5"
]

[project.optional-dependencies]
dev = ["pytest>=8"]
research = [
  "datasets>=2.18",
  "matplotlib>=3.8",
  "pandas>=2.0",
  "psutil>=5.9",
  "scikit-learn>=1.4",
  "scipy>=1.12",
  "sentence-transformers>=3"
]

[tool.setuptools.packages.find]
include = ["bsrt_neural_compression*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
